<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ROV Interface - Sensor Ultrassônico</title>
  <style>
    /* ---------- ESTILO GERAL ---------- */
    body{
      margin:0;
      padding:0;
      font-family:'Courier New',monospace;
      background:#0a0f1c;
      color:#00ffcc;
    }

    header{
      text-align:center;
      padding:20px;
      background:#111;
      border-bottom:2px solid #00ffcc;
    }
    header h1{margin:0;font-size:28px}
    header button{
      margin-top:10px;
      background:#003344;
      border:1px solid #00ffcc;
      color:#00ffcc;
      padding:10px 20px;
      cursor:pointer;
      font-weight:bold;
    }
    header button:hover{background:#005566}

    .layout{display:flex;height:calc(100vh - 90px);}

    /* ---------- PAINEL LATERAL ---------- */
    .left{
      width:350px;background:#111;padding:20px;
      border-right:2px solid #00ffcc;display:flex;flex-direction:column;
    }
    #valor{
      font-size:1.8em;margin-bottom:30px;padding:15px;text-align:center;
      background:#000;border:1px dashed #00ffcc;
    }
    table{width:100%;border-collapse:collapse;background:#000}
    th,td{border:1px solid #00ffcc;padding:8px;text-align:center}
    th{background:#003344}

    /* ---------- ÁREA DAS CÂMERAS ---------- */
    .center{flex:1;background:#000;display:flex;justify-content:center;align-items:center;}
    .cam-wrapper{display:flex;flex-direction:column;gap:15px;width:90%;max-width:1000px;}

    /* --- mini câmeras --- */
    .mini-strip{display:flex;gap:15px;justify-content:center;}
    .video-wrapper{
      flex:1;max-width:32%;aspect-ratio:16/9;overflow:hidden;
      border:2px solid #00ffcc;border-radius:8px;box-shadow:0 0 15px #00ffcc;
      position:relative;
    }
    .video-wrapper video{
      width:100%;height:100%;object-fit:cover;transform-origin:center center;
    }
    /* focos diferentes + zoom */
    #cam1{transform:scale(1.4);object-position:left center;}
    #cam2{transform:scale(1.6);object-position:center center;}
    #cam3{transform:scale(1.4);object-position:right center;}

    /* --- câmera principal --- */
    #camMain{
      width:100%;border:3px solid #00ffcc;border-radius:10px;
      box-shadow:0 0 30px #00ffcc;aspect-ratio:16/9;object-fit:cover;
    }

    /* ---------- SCROLLBAR ---------- */
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#111}
    ::-webkit-scrollbar-thumb{background:#00ffcc}
  </style>
</head>
<body>

  <header>
    <h1>ROV - Interface de Monitoramento</h1>
    <button id="connect">Conectar ao Arduino</button>
  </header>

  <div class="layout">
    <!-- PAINEL LATERAL -->
    <div class="left">
      <div id="valor">Distância: -- m</div>

      <h2>Histórico de Leituras</h2>
      <table id="tabela">
        <thead><tr><th>Horário</th><th>Distância</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- ÁREA DAS CÂMERAS -->
    <div class="center">
      <div class="cam-wrapper">
        <!-- 3 câmeras menores -->
        <div class="mini-strip">
          <div class="video-wrapper"><video id="cam1" autoplay playsinline muted></video></div>
          <div class="video-wrapper"><video id="cam2" autoplay playsinline muted></video></div>
          <div class="video-wrapper"><video id="cam3" autoplay playsinline muted></video></div>
        </div>
        <!-- câmera principal -->
        <video id="camMain" autoplay playsinline></video>
      </div>
    </div>
  </div>

  <script>
    /* ---------- SERIAL / SENSOR ---------- */
    const connectButton = document.getElementById('connect');
    const valorDisplay  = document.getElementById('valor');
    const tabelaBody    = document.querySelector('#tabela tbody');
    let port, historico = [];

    function atualizarTabela(){
      tabelaBody.innerHTML='';
      historico.slice(-10).reverse().forEach(({hora,distancia})=>{
        tabelaBody.insertAdjacentHTML('beforeend',`<tr><td>${hora}</td><td>${distancia}</td></tr>`);
      });
    }

    connectButton.addEventListener('click', async ()=>{
      try{
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });

        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable);
        const reader = decoder.readable.getReader();

        while(true){
          const {value,done} = await reader.read();
          if(done){reader.releaseLock();await port.close();break;}
          if(value){
            const distancia = value.trim();
            const hora = new Date().toLocaleTimeString();
            valorDisplay.textContent = `Distância: ${distancia}`;
            historico.push({hora,distancia});
            atualizarTabela();
          }
        }
      }catch(err){alert('Erro: '+err);}
    });

    /* ---------- WEBCAM / CÂMERAS ---------- */
    const vids = ['camMain','cam1','cam2','cam3'].map(id=>document.getElementById(id));
    navigator.mediaDevices.getUserMedia({ video:true })
      .then(stream=>vids.forEach(v=>v.srcObject=stream))
      .catch(err=>alert('Não foi possível acessar a câmera: '+err));
  </script>

</body>
</html>
